name: Autonomous NLCB Live Results Sync (Manual Trigger)

# Schedule triggers removed to avoid burning Free GitHub Actions minutes (2,000 min/mo limit).
# Automated $0/mo scheduling runs via cron-job.org + Cloudflare Worker Cron + Vercel Cron + DB-locked public pulse.
on:
  workflow_dispatch:

jobs:
  sync:
    name: Scrape NLCB & Update Turso Cloud DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Autonomous Sync Engine
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_WORKER_PROXY_URL: ${{ secrets.CLOUDFLARE_WORKER_PROXY_URL }}
          CLOUDFLARE_PROXY_SECRET: ${{ secrets.CLOUDFLARE_PROXY_SECRET }}
        run: npx tsx scripts/autonomous_cron.ts
